locale = "en-AU"
label = "English"
weight = 1
title = "The Island Monkeys"

[params]
  displayName = "EN"
  isoCode = "en"
  rtl = false
  dateFormat = "2 January 2006"
  # Logos live in assets/img/. "dark" = black lettering (light theme), "light" = white lettering (dark theme)
  logo = "img/logo-dark-islandmonkeys.png"
  secondaryLogo = "img/logo-light-islandmonkeys.png"
  description = "Web design, SEO & digital marketing agency for local businesses in Dumaguete, Dauin, Bohol, Cebu and Davao. WordPress, Shopify and Google Ads experts."
  # Used in the meta keywords tag and the WebSite schema (Google itself ignores meta keywords)
  keywords = [
    "web design Dumaguete", "SEO Dumaguete", "digital marketing Dumaguete",
    "web design Dauin", "web design Bohol", "SEO Bohol",
    "web design Cebu", "SEO Cebu", "web design Davao", "SEO Davao",
    "WordPress developer Philippines", "Shopify developer Philippines",
    "Google Ads Philippines", "hotel and resort websites Philippines",
  ]

  [params.author]
    name = "The Island Monkeys"
    headline = "Web infrastructure, search visibility and revenue-driven marketing"
