# -- Theme Options --
# Docs: https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "ocean"
defaultAppearance = "light" # light or dark
autoSwitchAppearance = true

enableSearch = false
enableCodeCopy = false
disableTextInHeader = true # the logo already shows the name
fingerprintAlgorithm = "sha512"

[header]
  layout = "fixed" # basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

[footer]
  showMenu = false
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true
  # 3-column footer (contact, menu, services). Set to true to show it again.
  showColumns = false
  # Services listed in the expanded footer (layouts/partials/footer.html)
  services = [
    "Architecture & Management",
    "SEO & GEO",
    "Performance Marketing",
    "Email Marketing & Retention",
  ]

[homepage]
  # "custom" renders layouts/partials/home/custom.html (one-page layout)
  layout = "custom"
  # Set to true (and see content/blog/_index.md) once the blog is enabled
  showRecent = false
  showRecentItems = 3
  showMoreLink = false
  showMoreLinkDest = "/blog/"

[article]
  showDate = true
  showAuthor = true
  showReadingTime = true
  showBreadcrumbs = false
  showEdit = false

[list]
  showBreadcrumbs = false
  groupByYear = false

# -- The Island Monkeys: contact details (used by the footer) --
