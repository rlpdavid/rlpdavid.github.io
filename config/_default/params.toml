# -- Theme Options --
# Docs: https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "ocean"
defaultAppearance = "light" # light or dark
autoSwitchAppearance = true

enableSearch = false
enableCodeCopy = false
disableTextInHeader = true # the logo already shows the name
fingerprintAlgorithm = "sha512"

[header]
  layout = "fixed" # basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

[footer]
  showMenu = false
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true
  # 3-column footer (contact, menu, services). Set to true to show it again.
  showColumns = false
  # Services listed in the expanded footer (layouts/partials/footer.html)
  services = [
    "Architecture & Management",
    "SEO & GEO",
    "Performance Marketing",
    "Email Marketing & Retention",
  ]

[homepage]
  # "custom" renders layouts/partials/home/custom.html (one-page layout)
  layout = "custom"
  # Set to true (and see content/blog/_index.md) once the blog is enabled
  showRecent = false
  showRecentItems = 3
  showMoreLink = false
  showMoreLinkDest = "/blog/"

[article]
  showDate = true
  # Author box hidden on posts (the author is still in the page's structured data)
  showAuthor = false
  showReadingTime = true
  showWordCount = false
  showBreadcrumbs = true
  showEdit = false
  # Big feature image at the top of each post (uses the post's feature* image)
  showHero = true
  heroStyle = "big"
  showTableOfContents = true
  showReadingProgress = true
  showPagination = true
  showRelatedContent = true
  relatedContentLimit = 3
  sharingLinks = ["linkedin", "facebook", "whatsapp", "email"]
  # Category badge under the date on posts and on the blog cards. Tags are hidden there (showTags = false);
  # on a post they show in the right-hand column instead (layouts/_default/single.html).
  showTaxonomies = true
  showTags = false

[list]
  showBreadcrumbs = true
  groupByYear = false
  # Blog index as a grid of cards with the feature image and summary
  cardView = true
  showSummary = true
  featureImageHover = true

# /categories/ and /tags/ overview pages
[taxonomy]
  showTermCount = true
  showBreadcrumbs = true

# A single category or tag page, e.g. /categories/seo-geo/
[term]
  showBreadcrumbs = true
  groupByYear = false
  cardView = true

# -- The Island Monkeys: contact details (used by the footer) --
[contact]
  email = "info@theislandmonkeys.com"
  phone = "+63 999 559 1284"
  whatsapp = "+1 858 848 6908"
  location = "Dumaguete City, Philippines"

# -- Local SEO: LocalBusiness structured data (layouts/partials/extend-head-uncached.html) --
[seo]
  addressLocality = "Dumaguete City"
  addressRegion = "Negros Oriental"
  addressCountry = "PH"
  # Areas we serve; type is a schema.org place type (City or AdministrativeArea)
  areaServed = [
    { name = "Dumaguete City", type = "City" },
    { name = "Dauin", type = "City" },
    { name = "Bohol", type = "AdministrativeArea" },
    { name = "Cebu", type = "AdministrativeArea" },
    { name = "Davao City", type = "City" },
  ]
  services = [
    "Web design & development", "WordPress", "Shopify", "Adobe Commerce (Magento)",
    "Search engine optimisation (SEO)", "Generative engine optimisation (GEO)",
    "Google Ads (PPC)", "Email marketing (Klaviyo, Mailchimp)",
  ]

# -- Search engine verification --
# Google Search Console: Add property -> URL prefix https://theislandmonkeys.com/ -> HTML tag,
# then paste the content="..." value here.
[verification]
  google = ""
