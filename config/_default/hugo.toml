# -- Site Configuration --
# Theme docs: https://blowfish.page/docs/configuration/

theme = "blowfish"
baseURL = "https://theislandmonkeys.com/"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0
buildDrafts = false
buildFuture = false
enableEmoji = true

# Blog categories and tags (/categories/, /tags/). Only these two, no /authors/ or /series/ pages.
[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

# Google Analytics 4 (only added to production builds, not hugo server)
[services]
  [services.googleAnalytics]
    ID = "G-S8E2FJ69HJ"
